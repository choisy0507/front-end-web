<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extend Your Collection</title>

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="page">
      <header class="intro">
        <h1>Extend Your Collection</h1>
      </header>

      <section class="collection" aria-labelledby="collection-title">
        <div class="collection-header">
          <h2 id="collection-title">Scent Cards</h2>

          <div class="controls" role="group" aria-label="Card controls">
            <button id="reveal-all" type="button">Reveal All</button>
            <button id="hide-all" type="button">Hide All</button>
          </div>
        </div>

        <div id="card-list" class="card-list"></div>
      </section>
    </main>
  </body>
</html>
