<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Solar System</h1>
    </header>

    <main>
      <section class="solar-system">
        <div class="star star1">★</div>
        <div class="star star2">★</div>
        <div class="star star3">★</div>
        <div class="star star4">★</div>

        <div class="sun">
          <div class="sun-shape"></div>
          <p>Sun</p>
        </div>

        <div class="planet mercury">
          <div class="mercury-shape"></div>
          <p>Mercury</p>
        </div>

        <div class="planet venus">
          <div class="venus-shape"></div>
          <p>Venus</p>
        </div>

        <div class="planet earth">
          <div class="earth-shape"></div>
          <p>Earth</p>
        </div>

        <div class="moon">
          <div class="moon-shape"></div>
          <p>Moon</p>
        </div>

        <div class="planet mars">
          <div class="mars-shape"></div>
          <p>Mars</p>
        </div>

        <div class="planet jupiter">
          <div class="jupiter-shape"></div>
          <p>Jupiter</p>
        </div>

        <div class="planet saturn">
          <div class="saturn-shape"></div>
          <p>Saturn</p>
        </div>

        <div class="planet uranus">
          <div class="uranus-shape"></div>
          <p>Uranus</p>
        </div>

        <div class="planet neptune">
          <div class="neptune-shape"></div>
          <p>Neptune</p>
        </div>
      </section>
    </main>
  </body>
</html>
